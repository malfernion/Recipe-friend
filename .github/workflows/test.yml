name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site has no dependencies and no build step. The MCP server
      # has two, so they are installed before the tests that reach them;
      # the app's own tests still load its modules directly and run on
      # node's built-in runner.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the server's dependencies
        run: npm ci

      - name: Run tests
        run: node --test test/*.test.js

      # Cheap insurance that a syntax error can never reach the site: the
      # server serves the checkout as-is, with no build step.
      - name: Check every script parses
        run: for f in js/*.js mcp/*.js; do node --check "$f" || exit 1; done

  # The database: the schema, the policies and the functions that are the
  # app's security model, run on the same images production runs
  # (server/compose.yaml) and asked directly. A job of its own, so a stack
  # that will not start is told apart from an app that is broken.
  db:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:local-dev-only-postgres-password@127.0.0.1:54322/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The development values, which are fakes and committed as such.
      - name: Start the stack
        run: |
          cp server/.env.example server/.env
          docker compose -f server/compose.yaml up -d --wait --wait-timeout 300

      - name: Apply the schema and migrations
        run: server/migrate.sh

      # Twice, because running it on an up-to-date database has to be a no-op.
      - name: Check the migrations are idempotent
        run: server/migrate.sh

      - name: Run database tests
        run: node --test test/db-*.test.js

      - name: Show the stack's logs
        if: failure()
        run: docker compose -f server/compose.yaml logs --no-color --tail 200

  # Workstream E's migration scripts (server/migrate-from-supabase/), run
  # for real between two copies of the dev stack: one playing the hosted
  # project, one the lab. Their own job, because it needs both stacks.
  migrate:
    runs-on: ubuntu-latest
    env:
      MIGRATE_TEST_SOURCE_DB: postgres://postgres:local-dev-only-postgres-password@127.0.0.1:54381/postgres
      MIGRATE_TEST_TARGET_DB: postgres://postgres:local-dev-only-postgres-password@127.0.0.1:54382/postgres
      MIGRATE_TEST_SOURCE_URL: http://127.0.0.1:18181
      MIGRATE_TEST_TARGET_URL: http://127.0.0.1:18182
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start two stacks and migrate both
        run: |
          cp server/.env.example server/.env
          for p in a:18181:54381 b:18182:54382; do
            IFS=: read name http db <<<"$p"
            HTTP_PORT=$http DB_PORT=$db PUBLIC_URL=http://localhost:$http \
              docker compose -p rfmig-$name -f server/compose.yaml up -d --wait --wait-timeout 300
            MIGRATE_COMPOSE="docker compose -p rfmig-$name -f server/compose.yaml" server/migrate.sh
          done

      - name: Run the migration tests
        run: node --test test/migrate-from-supabase.test.js

      - name: Show the stacks' logs
        if: failure()
        run: for p in a b; do docker compose -p rfmig-$p -f server/compose.yaml logs --no-color --tail 100; done
