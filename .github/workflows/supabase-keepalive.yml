name: Keep Supabase awake

# Free Supabase projects pause after 7 days without API activity, and a
# project left paused for 90 days is deleted. A daily request is enough to
# keep the clock reset. Once the app has real daily traffic this becomes
# redundant, but it costs one HTTP request a day to be safe.
on:
  schedule:
    # 07:17 UTC — an odd minute, to stay off the top-of-hour rush when
    # GitHub delays scheduled jobs.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project coordinates
        id: cfg
        # js/config.js is the single source of truth, and both values are
        # public by design — no repository secret is involved here.
        run: |
          url=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' js/config.js | head -1)
          key=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' js/config.js | head -1)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Could not read Supabase URL or key from js/config.js" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Pinging $url"

      - name: Ping
        run: |
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/auth/v1/health")
          echo "HTTP $code"
          cat /tmp/body.txt || true
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer with 200 — the project may be paused or misconfigured."
            exit 1
          fi
